<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Product Calculator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        padding: 40px;
    }
    .calculator-box {
        background-color: #ffffff;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 25px 35px;
        width: 350px;
        box-shadow: 2px 2px 8px rgba(0,0,0,0.15);
    }
    h2 {
        text-align: center;
        color: #2c3e50;
    }
    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: #333;
    }
    input[type="text"],
    input[type="number"] {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #aaa;
        border-radius: 4px;
        box-sizing: border-box;
    }
    .result-box {
        margin-top: 25px;
        padding: 15px;
        background-color: #eafaf1;
        border: 1px solid #2ecc71;
        border-radius: 6px;
        text-align: center;
    }
    .result-box h3 {
        margin: 0;
        color: #27ae60;
    }
    #error {
        color: #e74c3c;
        font-size: 14px;
        margin-top: 8px;
        text-align: center;
    }
</style>
</head>
<body>

<div class="calculator-box">
    <h2>Interactive Product Calculator</h2>

    <label for="productName">Product Name:</label>
    <input type="text" id="productName" placeholder="Enter product name">

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" placeholder="Enter quantity" min="0">

    <label for="price">Price per Unit (₹):</label>
    <input type="number" id="price" placeholder="Enter price" min="0" step="0.01">

    <div class="result-box">
        <p id="productDisplay">Product: --</p>
        <h3 id="totalPrice">Total Price: ₹0.00</h3>
    </div>
    <div id="error"></div>
</div>

<script>
    // Get references to the input fields and output elements
    const productNameInput = document.getElementById("productName");
    const quantityInput = document.getElementById("quantity");
    const priceInput = document.getElementById("price");
    const totalPriceDisplay = document.getElementById("totalPrice");
    const productDisplayEl = document.getElementById("productDisplay");
    const errorDisplay = document.getElementById("error");

    // Function to calculate and display the total price
    function calculateTotal() {
        const name = productNameInput.value.trim();
        const quantity = parseFloat(quantityInput.value);
        const price = parseFloat(priceInput.value);

        // Validation: check for empty or invalid numeric inputs
        if (isNaN(quantity) || isNaN(price) || quantity < 0 || price < 0) {
            totalPriceDisplay.textContent = "Total Price: ₹0.00";
            errorDisplay.textContent = "Please enter valid quantity and price.";
            productDisplayEl.textContent = "Product: " + (name || "--");
            return;
        }

        errorDisplay.textContent = "";
        const total = quantity * price;

        productDisplayEl.textContent = "Product: " + (name || "--");
        totalPriceDisplay.textContent = "Total Price: ₹" + total.toFixed(2);
    }

    // Event listeners: recalculate whenever the user types/changes a value
    productNameInput.addEventListener("input", calculateTotal);
    quantityInput.addEventListener("input", calculateTotal);
    priceInput.addEventListener("input", calculateTotal);
</script>

</body>
</html>
